<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Drawing App</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="toolbar">
            <button id="drawBtn" class="tool active" title="Draw">D</button>
            <button id="eraseBtn" class="tool" title="Erase">E</button>
            <button id="stampBtn" class="tool" title="Stamp">&#9733;</button>
            <button id="undoBtn" class="tool" title="Undo">&#8634;</button>
            <button id="clearBtn" class="tool" title="Clean canvas">C</button>
        </div>

        <div class="main">
            <div class="controls">
                <div class="panel size-panel">
                    <label for="sizeInput">Size: <span id="sizeValue">8</span>px</label>
                    <input type="range" id="sizeInput" min="1" max="60" value="8">
                    <div class="range-labels">
                        <span>min</span>
                        <span>max</span>
                    </div>
                </div>

                <div class="panel color-panel">
                    <label for="colorInput">Color</label>
                    <input type="color" id="colorInput" value="#222222">
                </div>
            </div>

            <div class="canvas-box">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
