<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Drawing App</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23222'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="toolbar" aria-label="Tools">
            <button class="tool active" id="drawBtn" type="button" title="Draw (D)" aria-pressed="true">D</button>
            <button class="tool" id="eraseBtn" type="button" title="Erase (E)" aria-pressed="false">E</button>
            <button class="tool" id="stampBtn" type="button" title="Stamp (S)" aria-pressed="false">&#9733;</button>
            <button class="tool action" id="undoBtn" type="button" title="Undo (Ctrl+Z)">&#8634;</button>
            <button class="tool action" id="clearBtn" type="button" title="Clean canvas (C)">C</button>
        </aside>

        <main class="workspace">
            <div class="controls">
                <label class="control size-control" for="sizeInput">
                    <span class="control-label">Size: <output id="sizeValue" for="sizeInput">8</output>px</span>
                    <input type="range" id="sizeInput" min="1" max="60" value="8">
                    <span class="range-ends"><span>min</span><span>max</span></span>
                </label>

                <label class="control color-control" for="colorInput">
                    <span class="control-label">Color</span>
                    <input type="color" id="colorInput" value="#222222">
                </label>
            </div>

            <div class="canvas-wrap" id="canvasWrap">
                <canvas id="canvas" aria-label="Drawing area"></canvas>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
